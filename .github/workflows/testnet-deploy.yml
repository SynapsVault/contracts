name: Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Optional checkpoint (JSON) of completed deployment operations to resume from"
        required: false
        default: ""
        type: string
      resume:
        description: "Resume from existing deployments instead of redeploying everything"
        required: false
        default: false
        type: boolean

concurrency:
  group: testnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate checkpoint
        if: ${{ inputs.checkpoint != '' }}
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CHECKPOINT" | jq -e 'type == "object" and (.completed | type == "array") and (all(.completed[]; type == "string"))' >/dev/null; then
            echo "::error::Invalid checkpoint: expected {\"completed\": [\"<operation>\", ...]}"
            exit 1
          fi
          echo "Checkpoint validated."

      - name: Read back existing deployments
        id: existing
        run: |
          set -euo pipefail
          if [ -f deployed/contract-ids.env ]; then
            echo "Found existing deployments:"
            cat deployed/contract-ids.env
            echo "has_existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing deployments found."
            echo "has_existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (resumable)
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
          RESUME: ${{ inputs.resume }}
          HAS_EXISTING: ${{ steps.existing.outputs.has_existing }}
        run: |
          set -euo pipefail
          args=()
          if [ "$RESUME" = "true" ] || [ "$HAS_EXISTING" = "true" ]; then
            args+=(--resume)
          fi
          if [ -n "$CHECKPOINT" ]; then
            printf '%s' "$CHECKPOINT" > checkpoint.json
            args+=(--checkpoint checkpoint.json)
          fi
          echo "Running deployment with: ${args[*]:-<no resume flags>}"
          ./scripts/deploy.sh "${args[@]}"

name: Testnet Deploy

on:
  workflow_dispatch:
    inputs:
      checkpoint:
        description: "Optional checkpoint (JSON) of completed deployment operations to resume from"
        required: false
        default: ""
        type: string
      resume:
        description: "Resume from existing deployments instead of redeploying everything"
        required: false
        default: false
        type: boolean

# Serialize deployments per network so overlapping runs cannot deploy contracts
# or write the same manifest path concurrently.
#
# Cancellation behavior:
# - `cancel-in-progress: false` means a newly queued run waits for the in-flight
#   deployment to finish instead of cancelling it. This prevents a partially
#   applied deployment (some contracts deployed, manifest not yet written) from
#   being interrupted mid-flight.
# - At most one run per network is active and one is pending; additional queued
#   runs supersede the older pending run (GitHub keeps only the latest pending).
# - The group is keyed on the resolved network so testnet and futurenet deploys
#   do not block each other.
concurrency:
  group: testnet-deploy-${{ github.event.inputs.network || 'testnet' }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  checks: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "27.0.0"
  # Bounded retry policy for friendbot funding calls.
  FRIENDBOT_MAX_ATTEMPTS: "5"
  FRIENDBOT_BASE_DELAY_SECONDS: "3"

jobs:
  # Gate deployment on a successful CI run for the exact commit being deployed.
  # This prevents deploying a commit whose validation has not passed (or has
  # failed) on main. The check queries the CI workflow's conclusion for the
  # same SHA and fails the job if it is not `success`.
  verify-ci:
    name: Verify CI passed for ${{ github.sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI for the deployed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          echo "Checking CI status for commit $SHA in $REPO"

          # Look up the most recent CI workflow run for this exact commit.
          # `gh run list` filters by workflow file and commit SHA.
          run_json=$(gh run list \
            --repo "$REPO" \
            --workflow ci.yml \
            --commit "$SHA" \
            --limit 1 \
            --json databaseId,status,conclusion,headSha)

          count=$(echo "$run_json" | jq 'length')
          if [ "$count" -eq 0 ]; then
            echo "::error::No CI run found for commit $SHA; refusing to deploy unvalidated code"
            exit 1
          fi

          status=$(echo "$run_json" | jq -r '.[0].status')
          conclusion=$(echo "$run_json" | jq -r '.[0].conclusion')
          run_sha=$(echo "$run_json" | jq -r '.[0].headSha')

          if [ "$run_sha" != "$SHA" ]; then
            echo "::error::CI run SHA ($run_sha) does not match deployed commit ($SHA)"
            exit 1
          fi

          if [ "$status" != "completed" ]; then
            echo "::error::CI run for $SHA is not complete (status: $status); refusing to deploy"
            exit 1
          fi

          if [ "$conclusion" != "success" ]; then
            echo "::error::CI run for $SHA concluded '$conclusion'; deployment blocked"
            exit 1
          fi

          echo "CI passed for commit $SHA; proceeding with deployment"

  deploy:
    name: Deploy to ${{ github.event.inputs.network || 'testnet' }}
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate checkpoint
        if: ${{ inputs.checkpoint != '' }}
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$CHECKPOINT" | jq -e 'type == "object" and (.completed | type == "array") and (all(.completed[]; type == "string"))' >/dev/null; then
            echo "::error::Invalid checkpoint: expected {\"completed\": [\"<operation>\", ...]}"
            exit 1
          fi
          echo "Checkpoint validated."

      - name: Read back existing deployments
        id: existing
        run: |
          set -euo pipefail
          if [ -f deployed/contract-ids.env ]; then
            echo "Found existing deployments:"
            cat deployed/contract-ids.env
            echo "has_existing=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing deployments found."
            echo "has_existing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy (resumable)
        env:
          CHECKPOINT: ${{ inputs.checkpoint }}
          RESUME: ${{ inputs.resume }}
          HAS_EXISTING: ${{ steps.existing.outputs.has_existing }}
        run: |
          set -euo pipefail
          args=()
          if [ "$RESUME" = "true" ] || [ "$HAS_EXISTING" = "true" ]; then
            args+=(--resume)
          fi
          if [ -n "$CHECKPOINT" ]; then
            printf '%s' "$CHECKPOINT" > checkpoint.json
            args+=(--checkpoint checkpoint.json)
          fi
          echo "Running deployment with: ${args[*]:-<no resume flags>}"
          ./scripts/deploy.sh "${args[@]}"
  

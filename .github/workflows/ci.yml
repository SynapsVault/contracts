name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format + Clippy + Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build docs (rustdoc)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Test vault-registry
        run: cargo test --locked --package vault-registry

      - name: Test access-lease
        run: cargo test --locked --package access-lease

      - name: Test subscription
        run: cargo test --locked --package subscription

      - name: Gas / footprint report (vault-registry)
        run: cargo test --locked --package vault-registry gas -- --nocapture

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32v1-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Build all contracts
        run: cargo build --locked --target wasm32v1-none --release --workspace

      - name: Report WASM sizes
        run: |
          echo "| Contract | Size (bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for f in target/wasm32v1-none/release/*.wasm; do
            size=$(stat -c%s "$f")
            echo "$(basename "$f"): $size bytes"
            echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
            # Soroban rejects contracts over 64 KiB.
            if [ "$size" -gt 65536 ]; then
              echo "::error::$(basename "$f") exceeds the 64 KiB Soroban limit"
              exit 1
            fi
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-contracts
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 14

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Weekly dependency audit so advisories are caught between pushes.
    - cron: "0 6 * * 1"
  # Allow the testnet deploy workflow to gate on the validation result for the
  # exact commit it is about to deploy (see testnet-deploy.yml).
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to validate (defaults to the caller's commit)"
        required: false
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  STELLAR_CLI_VERSION: "27.0.0"
  # Pinned cargo-audit version. Bump deliberately (see the audit job's
  # "Report cargo-audit version" step) so audit behavior only changes when
  # this file changes, not on every scheduled run.
  CARGO_AUDIT_VERSION: "0.21.1"
  # Keep in sync with `rust-version` in Cargo.toml.
  MSRV: "1.91"

jobs:
  check-events:
    name: Event table sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check contract event payloads match docs/CONTRACTS.md
        run: python3 scripts/check_events.py

  check-errors:
    name: Error table sync check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check Error enums match docs/CONTRACTS.md
        run: python3 scripts/check_errors.py

  audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    # cargo-audit is compiled from source on a cold cache, which dominates
    # runtime; 20 minutes leaves headroom for a slow crates.io fetch.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Pinned to CARGO_AUDIT_VERSION so the audit tool does not drift
      # independently of repository updates. To update: bump the env value
      # above in a dedicated PR and confirm the audit still passes.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version "$CARGO_AUDIT_VERSION"

      - name: Report cargo-audit version
        run: |
          installed=$(cargo audit --version)
          echo "cargo-audit: $installed"
          echo "cargo-audit: $installed" >> "$GITHUB_STEP_SUMMARY"
          if [ "$installed" != "cargo-audit $CARGO_AUDIT_VERSION" ]; then
            echo "::error::Installed cargo-audit ($installed) does not match pinned version ($CARGO_AUDIT_VERSION)"
            exit 1
          fi

      - name: Audit workspace lockfile
        run: cargo audit --file Cargo.lock

  msrv:
    name: MSRV check (${{ env.MSRV }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust ${{ env.MSRV }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Verify declared rust-version matches MSRV
        run: |
          declared=$(grep -E '^rust-version' Cargo.toml | head -n1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Cargo.toml rust-version: $declared"
          echo "CI MSRV: $MSRV"
          if [ "$declared" != "$MSRV" ]; then
            echo "::error::Cargo.toml rust-version ($declared) does not match CI MSRV ($MSRV)"
            exit 1
          fi

      - name: Locked dependency check on MSRV
        run: cargo check --workspace --all-targets --locked

  lint:
    name: Format + Clippy + Docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build docs (rustdoc)
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Test vault-registry
        run: cargo test --locked --package vault-registry

      - name: Test access-lease
        run: cargo test --locked --package access-lease

      - name: Test subscription
        run: cargo test --locked --package subscription

      - name: Gas / footprint report (vault-registry)
        run: cargo test --locked --package vault-registry gas -- --nocapture

  test-workspace:
    name: Test workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      - name: Lease encoding size
        run: cargo test --locked --package access-lease encoding_size -- --nocapture

      - name: Subscription encoding size
        run: cargo test --locked --package subscription encoding_size -- --nocapture
      - name: Test workspace
        run: cargo test --locked --workspace

  build:
    name: Build WASM
    runs-on: ubuntu-latest
    # Artifact production is gated on the complete validation set: lint, tests,
    # docs/event/error sync checks, and the dependency audit. GitHub Actions
    # skips this job (and its artifact upload) if any prerequisite fails or is
    # skipped, so a failed check prevents WASM artifacts from being produced.
    needs: [lint, test, test-workspace, check-events, check-errors, audit]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust stable + wasm32v1-none
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - uses: Swatinem/rust-cache@v2

      # Single maintained source of the Stellar CLI version, shared with the
      # deploy workflows via the reusable install action.
      - name: Install Stellar CLI
        uses: ./.github/actions/install-stellar-cli

      # soroban-sdk >= 25 refuses plain `cargo build` for wasm; the CLI
      # builds and post-processes (spec shaking) the contracts.
      - name: Build all contracts
        run: stellar contract build --locked

      - name: Report WASM sizes
        run: |
          # Explicit expected artifact list: every contract must produce a
          # non-empty WASM file. A missing or empty artifact fails the step
          # instead of silently iterating an empty glob.
          expected_contracts=("access_lease" "subscription" "vault_registry")
          wasm_dir="target/wasm32v1-none/release"

          echo "| Contract | Size (bytes) |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          missing=0
          for contract in "${expected_contracts[@]}"; do
            f="$wasm_dir/${contract}.wasm"
            if [ ! -f "$f" ]; then
              echo "::error::Expected WASM artifact not found: $f"
              missing=1
              continue
            fi
            size=$(stat -c%s "$f")
            if [ "$size" -eq 0 ]; then
              echo "::error::Expected WASM artifact is empty: $f"
              missing=1
              continue
            fi
            echo "$(basename "$f"): $size bytes"
            echo "| $(basename "$f") | $size |" >> "$GITHUB_STEP_SUMMARY"
            # Soroban rejects contracts over 64 KiB.
            if [ "$size" -gt 65536 ]; then
              echo "::error::$(basename "$f") exceeds the 64 KiB Soroban limit"
              exit 1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "::error::One or more expected WASM artifacts are missing or empty"
            exit 1
          fi

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-contracts
          path: |
            target/wasm32v1-none/release/access_lease.wasm
            target/wasm32v1-none/release/subscription.wasm
            target/wasm32v1-none/release/vault_registry.wasm
          if-no-files-found: error
